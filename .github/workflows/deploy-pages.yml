name: Deploy Marp Slides to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site output
        run: mkdir -p _site/marp/practice _site/marp/theory _site/marp/themes

      - name: Build Marp practice slides
        run: npx -y @marp-team/marp-cli@latest marp/practice/marp.md --html --allow-local-files --theme-set=marp/themes/kakao.css -o _site/marp/practice/index.html

      - name: Build Marp theory slides
        run: npx -y @marp-team/marp-cli@latest marp/theory/marp.md --html --allow-local-files --theme-set=marp/themes/kakao.css -o _site/marp/theory/index.html

      - name: Copy Marp static files
        run: |
          cp marp/index.html _site/marp/index.html
          cp -R marp/practice/assets _site/marp/practice/
          cp -R marp/practice/styles _site/marp/practice/
          cp -R marp/theory/assets _site/marp/theory/
          cp -R marp/theory/styles _site/marp/theory/
          cp -R marp/themes/. _site/marp/themes/

      - name: Copy landing page
        run: cp index.html _site/index.html

      - name: Disable Jekyll processing
        run: touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
