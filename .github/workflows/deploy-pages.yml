name: Deploy Slides to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: slidev/package-lock.json

      - name: Install Slidev dependencies
        working-directory: slidev
        run: npm ci

      - name: Prepare site output
        run: mkdir -p _site/marp _site/slidev

      - name: Build Marp slides
        run: npx @marp-team/marp-cli@latest marp/slides.md --html --allow-local-files -o _site/marp/index.html

      - name: Build Slidev slides
        working-directory: slidev
        run: npm run build:pages -- --out ../_site/slidev

      - name: Copy landing page
        run: cp index.html _site/index.html

      - name: Disable Jekyll processing
        run: touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

